name: Run UI Checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser integration against contracts
        run: |
          npm run dev > /tmp/ui-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:contracts
