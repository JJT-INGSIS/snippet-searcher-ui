worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /healthz { default_type text/plain; return 200 "ui-up\n"; }
        location = /app-config.json {
            alias /tmp/app-config.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        # API errors belong to the ingress/backend, never the SPA fallback.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(js|css|map|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ { try_files $uri =404; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
